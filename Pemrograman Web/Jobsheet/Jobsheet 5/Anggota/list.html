<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini - Daftar Anggota</title>
  <link rel="stylesheet" href="../assets/css/style-mobile-first.css">
<body>

  <header>
    <h1>SIMPUS-Mini</h1>
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../buku/list.html">Daftar Buku</a></li>

        <li><a href="tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Anggota</h2>
      <div class="search-box">
        <label for="search-input">Cari Nama Anggota</label>
        <input type="text" id="search-input" data-kolom="0" placeholder="Ketik nama anggota...">
      </div>
      <p id="info-jumlah" data-satuan="anggota"></p>
      
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Alamat</th>
              <th>No. Telepon</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Wicak Ramadhan</td>
              <td>Jl. Soekarno Hatta No. 9, Malang</td>
              <td>0812xxxxxxx</td>
              <td>
                <button type="button">Edit</button>
                <button type="button" class="btn-hapus">Hapus</button>
              </td>
            </tr>
            <tr>
              <td>Dewi Anggraini</td>
              <td>Jl. Veteran No. 12, Malang</td>
              <td>0813xxxxxxx</td>
              <td>
                <button type="button">Edit</button>
                <button type="button" class="btn-hapus">Hapus</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </section>
  </main>
  <script src="../assets/js/app.js"></script>
</body>
