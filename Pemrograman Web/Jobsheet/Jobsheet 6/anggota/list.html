<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini - Daftar Anggota</title>
  <link rel="stylesheet" href="../assets/css/style-mobile-first.css">
</head>
<body>

  <header>
    <h1>SIMPUS-Mini</h1>
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../buku/list.html">Daftar Buku</a></li>
        <li><a href="../buku/tambah.html">Tambah Buku</a></li>
        <li><a href="list.html" class="active">Daftar Anggota</a></li>
        <li><a href="tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Daftar Anggota</h2>
      <div class="search-box">
        <label for="search-input">Cari Nama Anggota</label>
        <input type="text" id="search-input" data-kolom="1" placeholder="Ketik nama anggota...">
      </div>
      <p id="info-jumlah" data-satuan="anggota"></p>
      <button type="button" id="btn-muat-ulang">Muat Ulang</button>
      <p id="loading-indicator" style="display:none;">Memuat data...</p>

      <div class="table-responsive">
        <table data-sumber="../data/anggota.json" data-kunci="no_anggota,nama,alamat,no_hp">
          <thead>
            <tr>
              <th>No. Anggota</th>
              <th>Nama</th>
              <th>Alamat</th>
              <th>No. Telepon</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <!-- Diisi dinamis oleh assets/js/tabel.js -->
          </tbody>
        </table>
      </div>

    </section>
  </main>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/tabel.js"></script>
</body>
</html>
