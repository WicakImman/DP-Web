<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini - Tambah Buku</title>
  <link rel="stylesheet" href="assets/css/style-mobile-first.css"></head>
<body>

  <header>
    <h1>SIMPUS-Mini</h1>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="list.html">Daftar Buku</a></li>
        <li><a href="tambah.html" class="active">Tambah Buku</a></li>
        <li><a href="../anggota/list.html">Daftar Anggota</a></li>
        <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Tambah Buku</h2>

      <form>
        <label for="judul">Judul</label>
        <input type="text" id="judul" name="judul" required>

        <label for="pengarang">Pengarang</label>
        <input type="text" id="pengarang" name="pengarang" required>

        <label for="tahun">Tahun Terbit</label>
        <input type="number" id="tahun" name="tahun" min="1900" max="2099" required>

        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori">
          <option value="fiksi">Fiksi</option>
          <option value="non-fiksi">Non-Fiksi</option>
          <option value="sains">Sains</option>
        </select>

        <label for="stok">Stok</label>
        <input type="number" id="stok" name="stok" min="0" required>

        <button type="submit">Simpan</button>
      </form>

    </section>
  </main>

</body>
</html>
