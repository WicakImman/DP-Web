<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini - Tambah Buku</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navMenu" aria-controls="navMenu"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <nav class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
          <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
          <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
          <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="card-title mb-3 text-primary">Tambah Buku</h2>

        <!-- Komponen Alert yang baru ditambahkan -->
        <div class="alert alert-success" role="alert">
          Buku berhasil ditambahkan ke dalam daftar!
        </div>

        <form>
          <div class="mb-3">
            <label for="judul" class="form-label fw-semibold">Judul</label>
            <input type="text" class="form-control" id="judul" name="judul" required>
          </div>

          <div class="mb-3">
            <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
            <input type="text" class="form-control" id="pengarang" name="pengarang" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
              <input type="number" class="form-control" id="tahun" name="tahun" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="kategori" class="form-label fw-semibold">Kategori</label>
              <select class="form-select" id="kategori" name="kategori">
                <option value="fiksi">Fiksi</option>
                <option value="non-fiksi">Non-Fiksi</option>
                <option value="sains">Sains & Teknologi</option>
                <option value="sejarah">Sejarah</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary">Simpan</button>
        </form>

      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
